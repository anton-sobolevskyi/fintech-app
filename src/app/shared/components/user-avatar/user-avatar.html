@let currentUser = user() || null;

@if (currentUser?.photoURL; as photoURL) {
  <img
    [src]="photoURL"
    class="rounded-full object-cover"
    [ngClass]="getClasses()"
    [alt]="currentUser?.displayName || currentUser?.email"
  />
} @else {
  <p-avatar
    [label]="currentUser?.displayName?.[0] || currentUser?.email[0] || '' | uppercase"
    shape="circle"
  />
}
