<p-dialog
  header="New account"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '400px' }"
  [draggable]="false"
>
  <form id="account-form" [formRoot]="accountForm" class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-2">
      <label pLabel for="currency">Currency</label>

      <p-selectbutton
        [options]="availableCurrencies()"
        [formField]="accountForm.currency"
        optionLabel="label"
        optionValue="value"
        aria-labelledby="basic"
      />

      @if (availableCurrencies().length === 0) {
        <p-message severity="warn" size="small" variant="simple">
          You already have an account in every available currency.
        </p-message>
      }
    </div>
  </form>

  <ng-template #footer>
    <button type="button" pButton severity="secondary" [text]="true" (click)="onHide()">
      Cancel
    </button>
    <button
      type="submit"
      pButton
      form="account-form"
      [disabled]="saving() || accountForm().invalid() || availableCurrencies().length === 0"
    >
      Create
    </button>
  </ng-template>
</p-dialog>
