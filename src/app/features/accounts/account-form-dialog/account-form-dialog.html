<p-dialog
  [header]="account() ? 'Edit Account' : 'New Account'"
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [style]="{ width: '480px' }"
  [draggable]="false"
>
  <form id="account-form" [formRoot]="accountForm" class="flex flex-col gap-4 pt-2">
    <div class="flex flex-col gap-2">
      <label pLabel for="name">Name</label>
      <input pInputText id="name" [formField]="accountForm.name" class="w-full" />
      @if (accountForm.name().touched() && accountForm.name().invalid()) {
        <p-message severity="error" size="small" variant="simple">
          {{ accountForm.name().errors()[0].message }}
        </p-message>
      }
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label pLabel for="type">Type</label>
        <p-select
          inputId="type"
          [options]="typeOptions"
          optionLabel="label"
          optionValue="value"
          [formField]="accountForm.type"
          class="w-full"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label pLabel for="currency">Currency</label>
        <p-select
          inputId="currency"
          [options]="currencyOptions"
          optionLabel="label"
          optionValue="value"
          [formField]="accountForm.currency"
          class="w-full"
        />
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label pLabel for="balance">Balance</label>
        <input
          pInputText
          id="balance"
          type="number"
          [formField]="accountForm.balance"
          class="w-full"
        />
      </div>
      <div class="flex flex-col gap-2">
        <label pLabel for="available">Available</label>
        <input
          pInputText
          id="available"
          type="number"
          [formField]="accountForm.availableBalance"
          class="w-full"
        />
      </div>
    </div>

    <div class="flex flex-col gap-2">
      <label pLabel for="status">Status</label>
      <p-select
        inputId="status"
        [options]="statusOptions"
        optionLabel="label"
        optionValue="value"
        [formField]="accountForm.status"
        class="w-full"
      />
    </div>

    <div class="flex flex-col gap-2">
      <label pLabel for="iban">IBAN (optional)</label>
      <input pInputText id="iban" [formField]="accountForm.iban" class="w-full" />
    </div>
  </form>

  <ng-template #footer>
    <button type="button" pButton severity="secondary" [text]="true" (click)="onHide()">
      Cancel
    </button>
    <button
      type="submit"
      pButton
      form="account-form"
      [disabled]="saving() || accountForm().invalid()"
    >
      {{ account() ? 'Save' : 'Create' }}
    </button>
  </ng-template>
</p-dialog>
