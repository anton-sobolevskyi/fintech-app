<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold m-0">Accounts</h1>
      <p class="mt-1 mb-0">Manage your bank accounts</p>
    </div>

    <button type="button" pButton (click)="openCreate()">
      <svg pIcon="plus"></svg>
      Add Account
    </button>
  </div>
</div>

<app-account-form-dialog [visible]="showDialog()" (visibleChange)="showDialog.set($event)" />
