<header class="h-16 px-4 flex items-center justify-between">
  <div class="flex items-center gap-3">
    <button
      pButton
      variant="outlined"
      severity="secondary"
      (click)="toggleSidebar()"
      pTooltip="Toggle menu"
      tooltipPosition="bottom"
    >
      <svg data-p-icon="bars"></svg>
    </button>

    <span class="text-xl font-semibold hidden sm:inline">BankDataHub</span>
  </div>

  <div class="flex items-center gap-2">
    @if (user(); as currentUser) {
      <button pButton variant="text" severity="secondary" (click)="menu.toggle($event)">
        <div class="flex items-center gap-2">
          <p-avatar
            [label]="currentUser?.displayName?.[0] || currentUser?.email[0] || '' | uppercase"
            shape="circle"
          />
          <span class="hidden md:inline font-medium text-color">
            {{ currentUser?.displayName || currentUser?.email }}
          </span>

          <svg data-p-icon="chevron-down"></svg>
        </div>
      </button>

      <p-menu #menu [model]="userMenuItems()" [popup]="true" styleClass="w-40" />
    }
  </div>
</header>
